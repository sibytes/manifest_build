# A sample job for sql_build.

resources:
  jobs:
    job_sql_build:
      name: job_sql_build


      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: manifest
          default: dev_unified.audit_full_rebuild
        - name: catalog
          default: ${var.catalog}
        - name: dry-run
          default: "False"
        - name: group
          default: ""

      tasks:
        - task_key: build_manifest
          python_wheel_task:
            package_name: sql_build
            entry_point: sql_build_build_manifest
            named_parameters:
              component: unified
              manifest-path: ./ci/sql_build
              root-path: ${workspace.root_path}/files
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              # By default we just include the .whl file generated for the sql_build package.
              # See https://docs.databricks.com/dev-tools/bundles/library-dependencies.html
              # for more information on how to add other libraries.
              - ../dist/*.whl
