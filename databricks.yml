# This is a Databricks asset bundle definition for sql_build.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sql_build
  uuid: bae1ec55-03ad-4865-915b-8b8666dd1b7d

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://adb-8723178682651460.0.azuredatabricks.net
    variables:
      catalog: dev_sql_build
      
  prod:
    mode: production
    workspace:
      host: https://adb-8723178682651460.0.azuredatabricks.net
      # We explicitly deploy to /Workspace/Users/shaun.ryan@shaunchiburihotmail.onmicrosoft.com to make sure we only have a single copy.
      root_path: /Workspace/Users/shaun.ryan@shaunchiburihotmail.onmicrosoft.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev_sql_build
    permissions:
      - user_name: shaun.ryan@shaunchiburihotmail.onmicrosoft.com
        level: CAN_MANAGE
