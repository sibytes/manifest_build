manifest:
  name: full_rebuild
  sql_project_root: src/sql
  catalog_name: dev_sql_build
  options:
    allow_drop_tables: True
    allow_drop_catalog: True

  pre_build:
    execution_order: 2
    scripts:
      - audit/scripts/*.sql

  catalog:
    execution_order: 0
    scripts:
      - catalog/sql_build.sql

  schema:
    execution_order: 1
    scripts:
      - schema/audit.sql

  tables:
    execution_order: 3
    scripts:
      - audit/table/*.sql