manifest:
  name: full_rebuild
  sql_project_root: src/sql
  catalog_name: dev_sql_build
  options:
    allow_drop_tables: True
    allow_drop_catalog: True

  catalog:
    execution_order: 0
    scripts:
      - catalog/sql_build.sql

  schema:
    execution_order: 1
    scripts:
      - schema/audit.sql

  pre_build:
    execution_order: 2
    scripts:
      - audit/scripts/*.sql
      - source/scripts/*.sql
      - stage/scripts/*.sql
      - dw/scripts/*.sql

  tables:
    execution_order: 3
    scripts:
      - audit/table/*.sql
      - source/table/*.sql
      - stage/table/*.sql
      - dw/table/*.sql

  views:
    execution_order: 3
    scripts:
      - source/view/*.sql
      - stage/view/*.sql
      - dw/view/*.sql

  procedures:
    execution_order: 3
    scripts:
      - dw/procedure/*.sql
      - stage/function/*.sql


